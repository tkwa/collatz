name: Markdown

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/markdown.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/markdown.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/check_markdown.py .
